const homeMusic=new Audio('home-music.mp3');homeMusic.loop=true;homeMusic.volume=.28;let homeMusicWanted=false;function playHomeMusic(){homeMusicWanted=true;if(!muted&&!document.hidden)homeMusic.play().catch(()=>{})}function stopHomeMusic(){homeMusicWanted=false;homeMusic.pause();homeMusic.currentTime=0}document.addEventListener('pointerdown',()=>{if(homeMusicWanted&&!muted&&!document.hidden)homeMusic.play().catch(()=>{})});document.addEventListener('keydown',()=>{if(homeMusicWanted&&!muted&&!document.hidden)homeMusic.play().catch(()=>{})});document.addEventListener('visibilitychange',()=>{if(document.hidden)homeMusic.pause();else if(homeMusicWanted&&!muted)homeMusic.play().catch(()=>{})});window.addEventListener('pagehide',()=>homeMusic.pause());
const shortWords='mat cat bat rat fat sad sat ant has hat cap black hand man Pam can'.split(' '),longWords='cake lake make take name game same came face race place space gate late date plate'.split(' ');const sentences=['A fat cat sat on a mat.','A black bat has a hat.','A sad rat sat on a mat.','Kate can make a cake.','Jake has a cake on a plate.','Kate and Jake make a cake.'];const app=document.querySelector('#app');let muted=false,mode=0,round=0,queue=[],locked=false,errors=0,selected=new Set();let voices=[];function getVoices(){voices=window.speechSynthesis?.getVoices()||[]}getVoices();if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=getVoices;

function start(m){stopHomeMusic();document.body.classList.remove('home-view');mode=m;if(m===0){startHouses();return;}round=0;errors=0;queue=m===3?[...sentences]:shuffle([...shortWords,...longWords]);draw()}function shell(title,instruction,body,total){locked=false;app.innerHTML=`<button class="all-games-button" onclick="home()">← Все игры</button><h2>${title}</h2><p class="sub">${instruction}</p><span class="badge">${round+1} / ${total}</span><div class="bar"><i style="width:${round/total*100}%"></i></div><div class="card" style="text-align:center">${body}<div id="feedback" class="feedback" aria-live="polite"></div><div id="next"></div></div>`}function draw(){if(round>=(mode===3?6:mode===2?8:queue.length)){finish();return}if(mode<2){const w=queue[round];shell(mode===0?'🏡 Два домика':'<img class="headphones-icon" src="headphones.png" alt="Наушники"> Услышь и выбери',mode===0?'Прочитай слово. В какой домик оно попадёт?':'Нажми «Послушать», затем выбери звук.',`${mode===0?`<div class="word">${w}</div>`:'<div class="icon"><img class="headphones-icon" src="headphones.png" alt="Наушники"></div>'}<p><button class="listen-button" onclick="speak(queue[round])">🔊 ${mode===0?'Послушать слово':'Послушать'}</button></p><div class="choices"><button class="green sound-answer" onclick="answer(0)">[æ]</button><button class="pink sound-answer" onclick="answer(1)">[eɪ]</button></div>`,queue.length)}else if(mode===2){let group=round%2,base=group?longWords:shortWords,other=group?shortWords:longWords;const odd=shuffle(other)[0];queue[round]={odd,words:shuffle([...shuffle(base).slice(0,3),odd])};shell('🔎 Найди лишнее','Прочитай четыре слова. Выбери слово с другим звуком A.',`<div class="choices">${queue[round].words.map(w=>`<button class="odd-word" onclick="oddAnswer('${w}')">${w}</button>`).join('')}</div><p class="small">После ответа можно прослушать каждое слово.</p>`,8)}else{selected=new Set();let words=queue[round].split(' ');shell('<img class="book-icon" src="book.png" alt="Книга"> П let housePending=[],houseAccepted=[[],[]],chosenWord=null,dragState=null;
function startHouses(){window.speechSynthesis?.cancel();housePending=shuffle([...shortWords,...longWords]);houseAccepted=[[],[]];chosenWord=null;drawHouses()}
function drawHouses(){app.innerHTML=`<button class="all-games-button" onclick="home()">← Все игры</button><h2>🏡 Два домика</h2><p class="sub">Перетащи каждое слово в домик с нужным звуком.<br>Можно нажать на слово, а затем на домик.</p><span class="badge">⭐ ${32-housePending.length} / 32</span><div class="houses-scene"><img src="two-houses.png" alt="Зелёный и розовый сказочные домики"><button class="house-target target-green" data-house="0" onclick="dropHouse(0)" aria-label="Зелёный домик: звук [æ]"><b>[æ]</b><span>${houseAccepted[0].length} слов</span></button><button class="house-target target-pink" data-house="1" onclick="dropHouse(1)" aria-label="Розовый домик: звук [eɪ]"><b>[eɪ]</b><span>${houseAccepted[1].length} слов</span></button></div><div class="house-feedback" id="house-feedback" aria-live="polite"></div><div class="word-bank" aria-label="Слова для сортировки">${housePending.map(w=>`<button class="sort-word" data-word="${w}" onclick="chooseWord('${w}')">${w}</button>`).join('')}</div><div class="accepted-words"><div class="green"><b>[æ]</b><p>${houseAccepted[0].join(' · ')||'Здесь появятся слова'}</p></div><div class="pink"><b>[eɪ]</b><p>${houseAccepted[1].join(' · ')||'Здесь появятся слова'}</p></div></div>${housePending.length?'':`<h2>🏆 Все слова дома!</h2><div class="choices"><button class="primary" onclick="startHouses()">Начать сначала</button><button onclick="home()">Другие игры</button></div>`}`;
app.querySelectorAll('.sort-word').forEach(el=>el.addEventListener('pointerdown',beginWordDrag))}
function chooseWord(w){if(!housePending.includes(w))return;chosenWord=w;app.querySelectorAll('.sort-word').forEach(e=>e.classList.toggle('selected-word',e.dataset.word===w));document.querySelector('#house-feedback').textContent='Теперь выбери домик для слова '+w;}
function dropHouse(n,w=chosenWord){if(!w||!housePending.includes(w))return;const ok=soundOf(w)===n;fx(ok);if(ok){houseAccepted[n].push(w);housePending=housePending.filter(x=>x!==w);chosenWord=null;drawHouses();document.querySelector('#house-feedback').textContent='⭐ Верно! '+w+' поселилось в домике.';}else{document.querySelector('#house-feedback').textContent='Попробуй другой домик. Слово '+w+' пока остаётся в списке.';}}
function beginWordDrag(e){if(e.button!==0)return;const el=e.currentTarget;dragState={id:e.pointerId,word:el.dataset.word,x:e.clientX,y:e.clientY,ghost:null};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',moveWordDrag);el.addEventListener('pointerup',endWordDrag,{once:true});el.addEventListener('pointercancel',cancelWordDrag,{once:true});}
function moveWordDrag(e){if(!dragState||e.pointerId!==dragState.id)return;if(!dragState.ghost&&Math.hypot(e.clientX-dragState.x,e.clientY-dragState.y)>7){const g=document.createElement('div');g.className='word-ghost';g.textContent=dragState.word;document.body.appendChild(g);dragState.ghost=g;}if(dragState.ghost){dragState.ghost.style.left=e.clientX+'px';dragState.ghost.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-house]');app.querySelectorAll('[data-house]').forEach(h=>h.classList.toggle('drop-hover',h===t));}}
function endWordDrag(e){if(!dragState)return;const d=dragState,t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-house]');cancelWordDrag();if(d.ghost){const el=e.currentTarget;el.onclick=null;setTimeout(()=>{if(el.isConnected)el.onclick=()=>chooseWord(d.word)},0);if(t)dropHouse(Number(t.dataset.house),d.word);else chooseWord(d.word);}}
function cancelWordDrag(){dragState?.ghost?.remove();dragState=null;app.querySelectorAll('[data-house]').forEach(h=>h.classList.remove('drop-hover'));}
home();
</script></html>
